<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel do Catálogo LBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Jost:wght@300;400;500&display=swap">

<style>
/* O painel fala a mesma língua do catálogo: mesmo fundo, mesmas fontes,
   mesmas pílulas, as mesmas placas claras dos produtos. Os tokens são os
   do :root do index.html — mudou lá, muda aqui. */
:root{
  --paper:#0C0C0E;
  --plate:#EDEDEB;
  --ink:#ECECEA;
  --muted:#8C8B91;
  --line:rgba(236,236,234,.16);
  --line-soft:rgba(236,236,234,.08);
  --ghost:rgba(236,236,234,.12);
  --chip:rgba(236,236,234,.08);
  --campo:#141417;
  --ok:#56B183; --alerta:#D9A441; --erro:#D2685C;
  --shadow:0 18px 44px -26px rgba(0,0,0,.9);
  --shadow-lift:0 30px 64px -26px rgba(0,0,0,1);
  --font-display:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-ui:'Jost','Avenir Next','Segoe UI',system-ui,sans-serif;
  --bar:68px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);
  font-weight:400;margin:0;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:40;background:var(--paper)}
.wrap{width:100%;max-width:1180px;margin-inline:auto;
  padding-left:max(20px,env(safe-area-inset-left,0px));
  padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.03em;margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit}
a{color:inherit}
img{display:block}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:2px}
.micro{font-size:.625rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

/* ---------- porta de entrada ---------- */
.porta{min-height:100svh;display:grid;place-items:center;padding-block:44px}
.porta-in{position:relative;width:min(386px,100%);isolation:isolate}
.porta-in > *{position:relative;z-index:1}
/* mesma palavra-fantasma da ficha do catálogo: atrás do título */
.titulo{position:relative;isolation:isolate;margin-top:30px}
.porta-ghost{position:absolute;top:-.28em;right:-.06em;z-index:-1;pointer-events:none;
  user-select:none;font-family:var(--font-display);font-weight:800;
  font-size:clamp(4.6rem,19vw,7rem);letter-spacing:-.07em;line-height:.76;color:var(--ghost)}
.titulo h1{margin-top:0}
.marca{height:34px;width:auto;object-fit:contain;filter:invert(1)}
.porta h1{font-weight:800;font-size:clamp(2.1rem,7.4vw,2.9rem);line-height:.88;
  letter-spacing:-.045em;margin-top:30px;text-wrap:balance}
.porta h1 em{font-style:normal;color:var(--muted)}
.porta form{display:flex;flex-direction:column;gap:13px;margin-top:30px}
.porta .aviso{margin-top:18px}

/* ---------- campos ---------- */
.campo{display:flex;flex-direction:column;gap:7px;min-width:0}
.campo label,.campo > .rot{font-size:.56rem;letter-spacing:.21em;text-transform:uppercase;color:var(--muted)}
.campo input,.campo select{background:var(--campo);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink);width:100%;
  transition:border-color .18s ease}
.campo input::placeholder{color:rgba(140,139,145,.7)}
.campo input:focus,.campo select:focus{border-color:var(--ink);outline:none}
/* seta própria: a nativa destoa do resto */
.campo select{appearance:none;-webkit-appearance:none;padding-right:38px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                   linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 19px) calc(50% + 1px),calc(100% - 14px) calc(50% + 1px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.campo select:hover{border-color:var(--line)}

/* ---------- pílulas e botões, iguais aos do catálogo ---------- */
.btn{display:inline-block;text-align:center;text-decoration:none;
  border:1px solid var(--ink);border-radius:999px;padding:12px 21px;
  font-size:.625rem;letter-spacing:.17em;text-transform:uppercase;
  transition:opacity .18s ease,background .18s ease,color .18s ease,border-color .18s ease}
.btn.cheio{background:var(--ink);color:var(--paper)}
.btn.cheio:hover{opacity:.84}
.btn.vazio{border-color:var(--line);color:var(--muted)}
.btn.vazio:hover{background:var(--chip);border-color:var(--ink);color:var(--ink)}
.btn.perigo{border-color:rgba(210,104,92,.5);color:var(--erro)}
.btn.perigo:hover{background:rgba(210,104,92,.12);border-color:var(--erro)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.mini{padding:9px 16px}
.pill{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:8px 15px;
  font-size:.625rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  white-space:nowrap;transition:color .18s ease,border-color .18s ease,background .18s ease}
.pill:hover{color:var(--ink);border-color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.aviso{font-size:.82rem;font-weight:300;line-height:1.6;color:var(--muted)}
.aviso.ruim{color:var(--erro)}
.aviso.bom{color:var(--ok)}
.nota{font-size:.78rem;font-weight:300;line-height:1.6;color:var(--muted);max-width:52ch}
.nota code{font-family:ui-monospace,Menlo,monospace;font-size:.92em;
  background:var(--chip);padding:1px 5px;border-radius:4px}

/* ---------- barra ---------- */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:var(--paper);
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line-soft)}
.topo-in{display:flex;align-items:center;gap:13px;min-height:var(--bar);padding-block:11px;flex-wrap:wrap}
.selo-marca{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.selo-marca img{height:27px;width:auto;object-fit:contain;filter:invert(1)}
.selo-marca span{font-size:.625rem;letter-spacing:.3em;text-transform:uppercase;
  color:var(--muted);padding-top:3px}
.topo .vai{flex:1 1 auto;min-width:0}
#resumo{font-variant-numeric:tabular-nums;white-space:nowrap}
.pend{font-size:.56rem;letter-spacing:.17em;text-transform:uppercase;color:var(--alerta);
  white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.pend::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--alerta);
  animation:pulso 2.4s ease-in-out infinite}
.pend:empty{display:none}
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.3}}

/* ---------- ferramentas ---------- */
.ferramentas{display:flex;flex-direction:column;gap:12px;padding-block:22px 18px}
.linha-ferramenta{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.pills{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;min-width:0;padding-bottom:1px}
.pills::-webkit-scrollbar{display:none}
.busca{flex:1 1 220px;min-width:0;background:var(--campo);border:1px solid var(--line);
  border-radius:999px;padding:10px 17px;color:var(--ink);transition:border-color .18s ease}
.busca::placeholder{color:rgba(140,139,145,.7)}
.busca:focus{border-color:var(--ink);outline:none}

/* ---------- lista ---------- */
.lista{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:14px;overflow:hidden;margin-bottom:64px}
.linha{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:15px;align-items:center;
  background:var(--paper);padding:11px 14px;text-align:left;width:100%;
  transition:background .18s ease}
.linha:hover{background:rgba(236,236,234,.045)}
/* a mesma placa clara em que os renders aparecem no catálogo */
.placa{width:54px;height:67px;border-radius:7px;overflow:hidden;background:var(--plate);
  flex:0 0 auto;box-shadow:var(--shadow)}
.placa img{width:100%;height:100%;object-fit:cover}
.linha .nome{display:block;font-family:var(--font-display);font-weight:600;font-size:1rem;
  letter-spacing:-.022em;line-height:1.15}
.linha .sub{display:block;margin-top:5px;font-size:.56rem;letter-spacing:.21em;
  text-transform:uppercase;color:var(--muted)}
.selos{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.selo{font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;padding:4px 9px;
  border-radius:999px;border:1px solid var(--line);white-space:nowrap;color:var(--muted);
  font-variant-numeric:tabular-nums}
.selo.ok{color:var(--ink);background:var(--chip)}
.selo.sem{color:var(--muted);border-style:dashed}
.selo.novo,.selo.alterado{color:var(--alerta);border-color:rgba(217,164,65,.45)}
.vazio-lista{padding:60px 0 70px;text-align:center;color:var(--muted);font-weight:300}

/* ---------- ficha ---------- */
dialog{border:0;padding:0;background:transparent;max-width:min(640px,94vw);width:100%;color:var(--ink)}
dialog::backdrop{background:color-mix(in srgb, var(--paper) 82%, transparent);backdrop-filter:blur(9px)}
.ficha{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow-lift);max-height:90svh;display:flex;flex-direction:column;overflow:hidden}
.ficha-topo{display:flex;align-items:center;gap:12px;padding:20px 22px 0;flex:0 0 auto}
.ficha-topo h2{font-weight:700;font-size:1.5rem;letter-spacing:-.035em;flex:1 1 auto;min-width:0}
.ficha-corpo{position:relative;padding:18px 22px 22px;overflow-y:auto;min-height:0;
  display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
/* a palavra-fantasma da ficha do catálogo, de novo aqui */
.ficha-ghost{position:absolute;top:-.26em;right:-.04em;z-index:0;pointer-events:none;
  user-select:none;font-family:var(--font-display);font-weight:800;
  font-size:clamp(3.4rem,13vw,5.4rem);letter-spacing:-.06em;line-height:.78;
  color:var(--ghost);text-align:right;max-width:130%}
.ficha-corpo > *{position:relative;z-index:1}
.ficha-pe{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:16px 22px;
  border-top:1px solid var(--line-soft);flex:0 0 auto;background:var(--paper)}
.ficha-pe .vai{flex:1 1 auto}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.foto-area{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.foto-area .placa{width:106px;height:132px;border-radius:9px}
.foto-area .lado{flex:1 1 190px;display:flex;flex-direction:column;gap:9px;min-width:0}
.linha-botoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fechar{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;font-size:1rem;line-height:1;flex:0 0 auto;
  transition:background .18s ease}
.fechar:hover{background:var(--chip)}
input[type=file]{display:none}

/* grade de tamanhos: a mesma caixinha do "tamanhos em estoque" do catálogo */
.tamgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:8px}
.tam{display:flex;flex-direction:column;gap:5px}
.tam b{font-family:var(--font-display);font-weight:600;font-size:.72rem;letter-spacing:.06em;
  color:var(--muted);text-align:center}
.tam input{background:var(--campo);border:1px solid var(--line);border-radius:8px;
  padding:10px 4px;color:var(--ink);width:100%;text-align:center;
  font-variant-numeric:tabular-nums;-moz-appearance:textfield;transition:border-color .18s ease,color .18s ease}
.tam input::-webkit-outer-spin-button,.tam input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tam input:focus{border-color:var(--ink);outline:none}
.tam input.tem{border-color:var(--ink);background:var(--ink);color:var(--paper);font-weight:500}
.tam input.tem + b,.tam:has(input.tem) b{color:var(--ink)}
.somatorio{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.somatorio b{color:var(--ink);font-weight:500}
.carregando{opacity:.5;pointer-events:none}

@media (max-width:620px){
  .dupla{grid-template-columns:1fr}
  .topo-in{gap:10px}
  .selo-marca span{display:none}
  #resumo{display:none}
  .ficha-pe .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
}
</style>

<div id="app"></div>

<dialog id="ficha"></dialog>

<script>
const COLS = { espanha:"Espanha", italia:"Itália", franca:"França", essenciais:"Essenciais" };
const TAMANHOS = ["PP","P","M","G","GG","XG","U"];
const TIPOS = ["Conjunto short","Conjunto calça","Macaquinho","Macacão longo","Macacão curto",
               "Corta-vento","Jaqueta","Camiseta","Top","Short","Short-saia","Calça","Legging",
               "Regata","Vestido","Macacão"];
const SITE = "https://lbafitwear.com.br";
// Endereço da função na Cloudflare. Fica aqui para ninguém precisar digitar.
const API_PADRAO = "https://lba-admin.lbafitwear.workers.dev";

const $ = s => document.querySelector(s);
const app = () => $("#app");
let estado = { api:"", token:"", catalogo:null, sha:null, sujos:new Set(), novos:new Set() };
// filtros viraram pílulas, como as do catálogo, então o estado é nosso
let filtro = { col:"", lig:"" };

/* ---------- utilidades ---------- */
const semAcento = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"");
const slugar = s => semAcento(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

function escapaHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

async function chamar(rota, opcoes = {}) {
  const r = await fetch(estado.api.replace(/\/+$/,"") + rota, {
    ...opcoes,
    headers: { "content-type":"application/json",
               ...(estado.token ? { authorization:"Bearer " + estado.token } : {}),
               ...(opcoes.headers || {}) }
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || `erro ${r.status}`);
  return d;
}

/* ---------- 1. endereço da API ---------- */

function telaEndereco(erro) {
  app().innerHTML = `<div class="wrap porta"><div class="porta-in">
    <img class="marca" src="../p/lba.png" alt="LBA Fitwear">
    <p class="micro" style="margin:26px 0 0">Primeiro acesso</p>
    <div class="titulo">
      <div class="porta-ghost" aria-hidden="true">LBA</div>
      <h1>Onde fica<br><em>a função.</em></h1>
    </div>
    <p class="aviso">Cole o endereço publicado na Cloudflare — algo como <code>https://lba-admin.SEU-NOME.workers.dev</code>. Fica guardado neste aparelho.</p>
    <form id="f">
      <div class="campo"><label for="api">Endereço da função</label>
        <input id="api" type="url" required placeholder="https://lba-admin.exemplo.workers.dev" autocomplete="off"></div>
      ${erro ? `<p class="aviso ruim">${escapaHtml(erro)}</p>` : ""}
      <button class="btn cheio" type="submit">Continuar</button>
    </form>
  </div></div>`;
  $("#f").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("#api").value.trim().replace(/\/+$/,"");
    try { localStorage.setItem("lba_api", v); } catch(_) {}
    estado.api = v;
    telaSenha();
  });
}

/* ---------- 2. senha ---------- */

function telaSenha(erro) {
  app().innerHTML = `<div class="wrap porta"><div class="porta-in">
    <img class="marca" src="../p/lba.png" alt="LBA Fitwear">
    <p class="micro" style="margin:26px 0 0">Painel interno</p>
    <div class="titulo">
      <div class="porta-ghost" aria-hidden="true">LBA</div>
      <h1>O catálogo<br><em>por dentro.</em></h1>
    </div>
    <p class="aviso">Preço, estoque, foto e modelo novo. Acesso restrito à equipe da LBA.</p>
    <form id="f">
      <div class="campo"><label for="senha">Senha</label>
        <input id="senha" type="password" required autocomplete="current-password" autofocus></div>
      ${erro ? `<p class="aviso ruim">${escapaHtml(erro)}</p>` : ""}
      <button class="btn cheio" type="submit" id="entrar">Entrar</button>
      <button class="btn vazio" type="button" id="trocarApi">Trocar o endereço da função</button>
    </form>
  </div></div>`;
  $("#trocarApi").addEventListener("click", () => telaEndereco());
  $("#f").addEventListener("submit", async e => {
    e.preventDefault();
    const b = $("#entrar"); b.disabled = true; b.textContent = "Entrando…";
    try {
      const d = await chamar("/api/login", { method:"POST", body: JSON.stringify({ senha: $("#senha").value }) });
      estado.token = d.token;
      try { sessionStorage.setItem("lba_token", d.token); } catch(_) {}
      await abrirPainel();
    } catch (err) {
      telaSenha(err.message === "senha incorreta" ? "Senha incorreta." : err.message);
    }
  });
}

/* ---------- 3. painel ---------- */

async function abrirPainel() {
  app().innerHTML = `<div class="wrap porta"><div class="porta-in">
    <img class="marca" src="../p/lba.png" alt="LBA Fitwear">
    <p class="aviso" style="margin-top:26px">Carregando o catálogo…</p>
  </div></div>`;
  try {
    const d = await chamar("/api/catalogo");
    // Protege contra meio caminho: painel novo com catálogo do formato antigo
    // (quando preço e estoque ainda vinham da loja) apagaria os dois ao gravar.
    if (!Array.isArray(d.catalogo?.itens) || !d.catalogo.itens.some(i => i && "tamanhos" in i))
      return telaSenha("O catálogo gravado ainda está no formato antigo. Recarregue a página em um minuto.");
    estado.catalogo = d.catalogo;
    estado.sha = d.sha;
  } catch (err) {
    if (/sess/.test(err.message)) return telaSenha("Sua sessão expirou. Entre de novo.");
    return telaSenha(err.message);
  }
  desenharPainel();
}


function pendencias() { return estado.sujos.size + estado.novos.size; }

/* O site mostra o modelo à venda quando ele tem preço e pelo menos uma peça.
   Mesma regra aqui, para o painel dizer a verdade sobre o que está no ar. */
function totalPecas(it) {
  return Object.values(it.tamanhos || {}).reduce((a, q) => a + (q > 0 ? q : 0), 0);
}
function aVenda(it) { return it.preco > 0 && totalPecas(it) > 0; }
const dinheiro = n => (n > 0 ? n.toLocaleString("pt-BR", { style:"currency", currency:"BRL" }) : "—");

/* Os tops avulsos da França têm contagem própria, por modelo: o mesmo top
   serve o conjunto de short e o de calça. */
function temAvulsa(it) {
  return it.col === "franca" && !!(estado.catalogo.avulso || {})[it.kind];
}

function desenharPainel() {
  app().innerHTML = `
    <header class="topo"><div class="wrap topo-in">
      <div class="selo-marca"><img src="../p/lba.png" alt="LBA Fitwear"><span>Catálogo</span></div>
      <span class="micro" id="resumo"></span>
      <span class="vai"></span>
      <span class="pend" id="pend"></span>
      <button class="btn cheio mini" id="salvar">Salvar alterações</button>
      <button class="btn vazio mini" id="sair">Sair</button>
    </div></header>
    <div class="wrap">
      <div class="ferramentas">
        <div class="linha-ferramenta">
          <input type="search" class="busca" id="busca" placeholder="Buscar por nome…" autocomplete="off">
          <button class="btn vazio mini" id="novo">+ Novo modelo</button>
        </div>
        <div class="linha-ferramenta">
          <div class="pills" id="pillsCol"></div>
          <div class="pills" id="pillsLig"></div>
        </div>
      </div>
      <div class="lista" id="lista"></div>
    </div>`;
  $("#salvar").addEventListener("click", salvar);
  $("#sair").addEventListener("click", sair);
  $("#novo").addEventListener("click", () => abrirFicha(null));
  $("#busca").addEventListener("input", desenharLista);
  app().addEventListener("click", ev => {
    const p = ev.target.closest(".pill");
    if (!p) return;
    if (p.dataset.col !== undefined) filtro.col = p.dataset.col;
    if (p.dataset.lig !== undefined) filtro.lig = p.dataset.lig;
    desenharLista();
  });
  desenharLista();
}

function statusLigacao(it) {
  const n = totalPecas(it);
  return aVenda(it)
    ? { cls:"ok", txt:`${dinheiro(it.preco)} · ${n} un` }
    : { cls:"sem", txt: it.preco > 0 ? "sem estoque" : "esgotado" };
}

function desenharPills() {
  $("#pillsCol").innerHTML = [["", "Todas"], ...Object.entries(COLS)].map(([k, v]) =>
    `<button class="pill" data-col="${k}" aria-pressed="${filtro.col === k}">${v}</button>`).join("");
  const n = estado.catalogo.itens.length;
  const nV = estado.catalogo.itens.filter(aVenda).length;
  $("#pillsLig").innerHTML =
    `<button class="pill" data-lig="" aria-pressed="${filtro.lig === ""}">Tudo ${n}</button>` +
    `<button class="pill" data-lig="ok" aria-pressed="${filtro.lig === "ok"}">À venda ${nV}</button>` +
    `<button class="pill" data-lig="sem" aria-pressed="${filtro.lig === "sem"}">Esgotados ${n - nV}</button>`;
}

function desenharLista() {
  const busca = ($("#busca")?.value || "").toLowerCase();
  const fc = filtro.col, fl = filtro.lig;
  const itens = estado.catalogo.itens.filter(it => {
    if (busca && !it.name.toLowerCase().includes(busca)) return false;
    if (fc && it.col !== fc) return false;
    if (fl === "sem" && aVenda(it)) return false;
    if (fl === "ok" && !aVenda(it)) return false;
    return true;
  });
  const nVenda = estado.catalogo.itens.filter(aVenda).length;
  $("#resumo").textContent = `${estado.catalogo.itens.length} modelos · ${nVenda} à venda`;
  $("#pend").textContent = pendencias() ? `${pendencias()} não salvo${pendencias() > 1 ? "s" : ""}` : "";
  desenharPills();
  $("#lista").innerHTML = itens.length ? itens.map(it => {
    const s = statusLigacao(it);
    const marca = estado.novos.has(it.slug) ? `<span class="selo novo">novo</span>`
                : estado.sujos.has(it.slug) ? `<span class="selo alterado">alterado</span>` : "";
    return `<button class="linha" data-slug="${escapaHtml(it.slug)}">
      <span class="placa"><img src="${SITE}/${escapaHtml(it.img)}" alt="" loading="lazy"
            onerror="this.style.visibility='hidden'"></span>
      <span>
        <span class="nome">${escapaHtml(it.name)}</span>
        <span class="sub">${escapaHtml(it.kind)} · ${COLS[it.col] || it.col}</span>
      </span>
      <span class="selos">${marca}<span class="selo ${s.cls}">${s.txt}</span></span>
    </button>`;
  }).join("") : `<div class="vazio-lista">Nenhum modelo nesse filtro.</div>`;
  $("#lista").querySelectorAll(".linha").forEach(b =>
    b.addEventListener("click", () => abrirFicha(b.dataset.slug)));
}

/* ---------- 4. ficha de um modelo ---------- */

function gradeTam(obj, pref) {
  const v = obj || {};
  return TAMANHOS.map(t =>
    `<label class="tam"><b>${t}</b><input type="number" min="0" step="1" inputmode="numeric"
      data-tam="${t}" data-g="${pref}" value="${v[t] > 0 ? v[t] : ""}"
      ${v[t] > 0 ? 'class="tem"' : ""}></label>`).join("");
}
function lerGrade(pref) {
  const o = {};
  document.querySelectorAll(`#ficha input[data-g="${pref}"]`).forEach(i => {
    const q = Math.max(0, Math.round(Number(i.value) || 0));
    if (q > 0) o[i.dataset.tam] = q;
  });
  return o;
}
function somarGrade(pref) {
  const o = lerGrade(pref);
  const n = Object.values(o).reduce((a, q) => a + q, 0);
  const alvo = $("#soma-" + pref);
  if (alvo) alvo.innerHTML = n ? `Total: <b>${n}</b> ${n === 1 ? "peça" : "peças"}` : "";
  document.querySelectorAll(`#ficha input[data-g="${pref}"]`).forEach(i =>
    i.classList.toggle("tem", Number(i.value) > 0));
}
const dinheiroCampo = v => {
  const n = Number(String(v).replace(/\s/g, "").replace(",", "."));
  return n > 0 ? Math.round(n * 100) / 100 : null;
};

function abrirFicha(slug) {
  const novo = !slug;
  const it = novo
    ? { slug:"", col:"franca", name:"", kind:"Conjunto short", img:"", preco:null, tamanhos:{} }
    : { ...estado.catalogo.itens.find(x => x.slug === slug) };
  // a mesma palavra-fantasma que o catálogo põe atrás do nome na ficha
  const fantasma = novo ? "Novo"
    : it.col === "essenciais" ? it.name.split(" ").pop() : it.name.split(" ")[0];
  const d = $("#ficha");
  d.innerHTML = `
    <div class="ficha">
      <div class="ficha-topo">
        <h2>${novo ? "Novo modelo" : escapaHtml(it.name)}</h2>
        <button class="fechar" id="x" aria-label="Fechar">&times;</button>
      </div>
      <div class="ficha-corpo">
        <div class="ficha-ghost" aria-hidden="true">${escapaHtml(fantasma)}</div>
        <div class="foto-area">
          <span class="placa"><img id="previa" src="${it.img ? SITE + "/" + escapaHtml(it.img) : ""}" alt=""
               onerror="this.style.visibility='hidden'"></span>
          <div class="lado">
            <p class="micro">Render do produto</p>
            <p class="nota">Proporção 4:5, como os outros. A imagem é reduzida para 860×1075 aqui mesmo, antes de subir.</p>
            <div class="linha-botoes">
              <button class="btn vazio" id="escolher">${it.img ? "Trocar foto" : "Escolher foto"}</button>
              <span class="nota" id="statusFoto"></span>
            </div>
            <input type="file" id="arquivo" accept="image/*">
          </div>
        </div>

        <div class="dupla">
          <div class="campo"><label for="f-name">Nome</label>
            <input id="f-name" value="${escapaHtml(it.name)}" placeholder="Lyon"></div>
          <div class="campo"><label for="f-col">Coleção</label>
            <select id="f-col">${Object.entries(COLS).map(([k,v]) =>
              `<option value="${k}" ${k===it.col?"selected":""}>${v}</option>`).join("")}</select></div>
        </div>

        <div class="dupla">
          <div class="campo"><label for="f-kind">Tipo de peça</label>
            <select id="f-kind">${TIPOS.map(t =>
              `<option ${t===it.kind?"selected":""}>${t}</option>`).join("")}</select></div>
          <div class="campo"><label for="f-slug">Identificador do arquivo</label>
            <input id="f-slug" value="${escapaHtml(it.slug)}" placeholder="lyon-short" ${novo?"":"readonly"}></div>
        </div>

        <div class="dupla">
          <div class="campo"><label for="f-preco">Preço</label>
            <input id="f-preco" inputmode="decimal" value="${it.preco > 0 ? it.preco : ""}" placeholder="285,00"></div>
          <div class="campo"><label for="f-de">Preço antigo, se em promoção</label>
            <input id="f-de" inputmode="decimal" value="${it.de > 0 ? it.de : ""}" placeholder="vazio = sem promoção"></div>
        </div>

        <div class="campo">
          <label>Peças em estoque, por tamanho</label>
          <div class="tamgrid">${gradeTam(it.tamanhos, "t")}</div>
          <p class="nota">Tamanho vazio ou em zero não aparece no site. <span class="somatorio" id="soma-t"></span></p>
          <p class="nota">Sem preço, ou sem nenhuma peça, o modelo entra como <strong>Esgotado</strong>: sai da aba “À venda” e aparece só em “Ver tudo”.</p>
        </div>

        <div class="campo" id="caixaAvulsa" hidden>
          <label>Tops avulsos deste modelo, por tamanho</label>
          <div class="tamgrid">${gradeTam((estado.catalogo.topEstoque || {})[it.name], "p")}</div>
          <p class="nota">Só a França vende peça por peça. Esta contagem é dos <strong>tops do modelo</strong>, não deste conjunto — o mesmo top serve o de short e o de calça. A calça ou o short vêm do estoque acima. <span class="somatorio" id="soma-p"></span></p>
        </div>
      </div>
      <div class="ficha-pe">
        ${novo ? "" : `<button class="btn perigo" id="remover">Remover do catálogo</button>`}
        <span class="vai"></span>
        <button class="btn vazio" id="cancelar">Cancelar</button>
        <button class="btn cheio" id="aplicar">${novo ? "Adicionar" : "Aplicar"}</button>
      </div>
    </div>`;

  let imgNova = it.img, base64Novo = null;

  $("#x").onclick = $("#cancelar").onclick = () => d.close();
  $("#escolher").onclick = () => $("#arquivo").click();
  if (novo) $("#f-name").addEventListener("input", e => {
    if (!$("#f-slug").dataset.tocado) $("#f-slug").value = slugar(e.target.value);
  });
  $("#f-slug").addEventListener("input", e => { e.target.dataset.tocado = "1"; });

  $("#arquivo").addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    $("#statusFoto").textContent = "Reduzindo…";
    try {
      const r = await reduzir(f);
      base64Novo = r.base64;
      $("#previa").src = r.dataUrl;
      $("#previa").style.visibility = "visible";
      $("#statusFoto").textContent = `pronta · ${Math.round(r.bytes/1024)} KB`;
    } catch (err) {
      $("#statusFoto").textContent = "não consegui ler essa imagem";
    }
  });

  // a caixa dos tops só vale para conjunto da França que se vende separado
  function sincronizarAvulsa() {
    const vale = $("#f-col").value === "franca" && !!(estado.catalogo.avulso || {})[$("#f-kind").value];
    $("#caixaAvulsa").hidden = !vale;
  }
  $("#f-col").addEventListener("change", sincronizarAvulsa);
  $("#f-kind").addEventListener("change", sincronizarAvulsa);
  sincronizarAvulsa();

  $("#ficha").querySelectorAll("input[data-g]").forEach(i =>
    i.addEventListener("input", () => somarGrade(i.dataset.g)));
  somarGrade("t"); somarGrade("p");

  if (!novo) $("#remover").addEventListener("click", () => {
    if (!confirmarNaPagina($("#remover"), "Remover mesmo?")) return;
    estado.catalogo.itens = estado.catalogo.itens.filter(x => x.slug !== it.slug);
    estado.sujos.add(it.slug);
    d.close(); desenharLista();
  });

  $("#aplicar").addEventListener("click", async () => {
    const preco = dinheiroCampo($("#f-preco").value);
    const de = dinheiroCampo($("#f-de").value);
    const dados = {
      slug: slugar($("#f-slug").value),
      col: $("#f-col").value,
      name: $("#f-name").value.trim(),
      kind: $("#f-kind").value,
      img: imgNova,
      preco,
      tamanhos: lerGrade("t")
    };
    if (de && preco && de > preco) dados.de = de;
    if (de && preco && de <= preco) return alertaFicha("O preço antigo precisa ser maior que o preço de hoje.");
    if (de && !preco) return alertaFicha("Pôs o preço antigo, mas faltou o preço de hoje.");
    if (!dados.name) return alertaFicha("Falta o nome.");
    if (!dados.slug) return alertaFicha("Falta o identificador do arquivo.");
    if (novo && estado.catalogo.itens.some(x => x.slug === dados.slug))
      return alertaFicha("Já existe um modelo com esse identificador.");
    if (novo && !base64Novo) return alertaFicha("Escolha a foto do modelo.");

    const btn = $("#aplicar"); btn.disabled = true; btn.textContent = "Enviando…";
    try {
      if (base64Novo) {
        const nome = novo ? `${dados.slug}.jpg` : `${dados.slug}-${Date.now().toString(36)}.jpg`;
        const r = await chamar("/api/foto", { method:"POST", body: JSON.stringify({ nome, base64: base64Novo }) });
        dados.img = r.caminho;
      }
    } catch (err) {
      btn.disabled = false; btn.textContent = novo ? "Adicionar" : "Aplicar";
      return alertaFicha("A foto não subiu: " + err.message);
    }

    // os tops são do modelo, não do conjunto: gravados pelo nome
    if (!$("#caixaAvulsa").hidden && dados.name) {
      const te = estado.catalogo.topEstoque || (estado.catalogo.topEstoque = {});
      const g = lerGrade("p");
      if (Object.keys(g).length) te[dados.name] = g; else delete te[dados.name];
    }

    if (novo) { estado.catalogo.itens.push(dados); estado.novos.add(dados.slug); }
    else {
      const i = estado.catalogo.itens.findIndex(x => x.slug === it.slug);
      const final = { ...estado.catalogo.itens[i], ...dados };
      // campo ausente em dados sobreviveria ao merge: promoção tirada some aqui
      if (!(dados.de > 0)) delete final.de;
      estado.catalogo.itens[i] = final;
      estado.sujos.add(dados.slug);
    }
    d.close(); desenharLista();
  });

  d.showModal();
  setTimeout(() => $("#f-name").focus(), 50);
}

function alertaFicha(txt) {
  let p = $("#ficha .ficha-pe .aviso");
  if (!p) { p = document.createElement("p"); p.className = "aviso ruim"; p.style.flex = "1 1 100%";
            $("#ficha .ficha-pe").prepend(p); }
  p.textContent = txt;
}

function confirmarNaPagina(botao, pergunta) {
  if (botao.dataset.confirmando === "1") return true;
  botao.dataset.confirmando = "1";
  const antes = botao.textContent;
  botao.textContent = pergunta;
  setTimeout(() => { botao.dataset.confirmando = ""; botao.textContent = antes; }, 4000);
  return false;
}

/* ---------- 5. imagem ---------- */

function reduzir(arquivo) {
  return new Promise((ok, falha) => {
    const img = new Image();
    img.onload = () => {
      const escala = Math.min(860 / img.width, 1075 / img.height, 1);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * escala);
      c.height = Math.round(img.height * escala);
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#EDEDEB"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const dataUrl = c.toDataURL("image/jpeg", 0.82);
      const base64 = dataUrl.split(",")[1];
      URL.revokeObjectURL(img.src);
      ok({ dataUrl, base64, bytes: Math.round(base64.length * 0.75) });
    };
    img.onerror = () => falha(new Error("imagem inválida"));
    img.src = URL.createObjectURL(arquivo);
  });
}

/* ---------- 6. gravar ---------- */

async function salvar() {
  const b = $("#salvar");
  if (!pendencias()) {
    // antes isso saía em silêncio e parecia que o botão não funcionava
    b.textContent = "Nada para salvar";
    setTimeout(() => { b.textContent = "Salvar alterações"; }, 2500);
    return;
  }
  b.disabled = true; b.textContent = "Salvando…";
  // top de modelo que não existe mais no catálogo só ocuparia espaço
  if (estado.catalogo.topEstoque) {
    const vivos = new Set(estado.catalogo.itens.filter(temAvulsa).map(x => x.name));
    for (const nome of Object.keys(estado.catalogo.topEstoque))
      if (!vivos.has(nome)) delete estado.catalogo.topEstoque[nome];
  }
  try {
    const d = await chamar("/api/catalogo", {
      method:"PUT",
      body: JSON.stringify({ catalogo: estado.catalogo, sha: estado.sha })
    });
    estado.sha = d.sha;
    estado.sujos.clear(); estado.novos.clear();
    b.textContent = "Salvo · já no ar";
    setTimeout(() => { b.textContent = "Salvar alterações"; b.disabled = false; }, 6000);
    desenharLista();
  } catch (err) {
    b.disabled = false; b.textContent = "Salvar alterações";
    if (/sess/.test(err.message)) return telaSenha("Sua sessão expirou. Entre de novo.");
    alert("Não salvou: " + err.message);
  }
}

function sair() {
  if (pendencias() && !confirm(`Há ${pendencias()} alteração(ões) sem salvar. Sair mesmo?`)) return;
  estado = { api: estado.api, token:"", catalogo:null, sha:null, sujos:new Set(), novos:new Set() };
  try { sessionStorage.removeItem("lba_token"); } catch(_) {}
  telaSenha();
}

addEventListener("beforeunload", e => { if (pendencias()) e.preventDefault(); });

/* ---------- entrada ---------- */

(function inicio() {
  try { estado.api = localStorage.getItem("lba_api") || ""; } catch(_) {}
  if (!estado.api) estado.api = API_PADRAO;
  if (!estado.api) return telaEndereco();
  try { estado.token = sessionStorage.getItem("lba_token") || ""; } catch(_) {}
  if (estado.token) return abrirPainel();
  telaSenha();
})();
</script>
